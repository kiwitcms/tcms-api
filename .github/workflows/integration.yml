name: integration test

# NOTE: Restricting branches prevents jobs from being doubled since
# a push to a pull request triggers two events.
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - master

jobs:
  test-on-linux:
    name: Py${{ matrix.python-version }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # note: always use the -latest OS variants b/c if conditions
        # match them as literals
        os: [ubuntu-latest]
        python-version: [3.14]

    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        pip install -r devel.txt

    - name: Build & start services
      run: |
        make build-services
        make run-services

        WEB_ADDR=`docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' web_kiwitcms_org`
        sudo sh -c "echo '$WEB_ADDR    web.kiwitcms.org' >> /etc/hosts"

    - name: Wait for web server to be ready
      run: |
        for i in $(seq 1 30); do
          if curl -sk -o /dev/null -w '%{http_code}' \
            https://web.kiwitcms.org:8443/accounts/login/ \
            | grep -q 200; then
            echo "Web server is ready!"
            exit 0
          fi
          echo "Waiting for web server... ($i/30)"
          sleep 2
        done
        echo "Web server didn't become ready"
        exit 1

    - name: Verify tcms-api can communicate via username/password
      run: |
        cat > ~/.tcms.conf << _EOF_
        [tcms]
        url = https://web.kiwitcms.org:8443/xml-rpc/
        username = kiwitcms-bot
        password = changeme
        _EOF_

        make verify-integration
        make verify-credentials-via-python

    - name: Collect logs
      if: always()
      run: |
        docker compose -f tests/krb5/docker-compose.yml logs --no-color > /tmp/docker-compose.log

    - name: Upload logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: logs
        path: /tmp/*.log
        if-no-files-found: ignore
